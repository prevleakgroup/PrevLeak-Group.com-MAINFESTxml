<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Redirect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f9f9f9;
      color: #222;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 520px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .muted {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OAuth Redirect</h1>
    <p class="muted">You can close this tab after the authentication response is forwarded.</p>
  </div>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const allowedParams = new Set(['code', 'state', 'error', 'error_description', 'error_uri']);
      let target = new URL('/', window.location.origin);

      const redirectUri = params.get('redirect_uri');
      if (redirectUri) {
        try {
          const candidate = new URL(redirectUri, window.location.origin);
          if (candidate.origin === window.location.origin) {
            target = candidate;
          } else {
            console.warn('Invalid redirect_uri: not same origin.');
          }
        } catch (error) {
          console.warn('Invalid redirect_uri: could not parse.');
          // Fall back to the safe default below.
        }
      }

      for (const [key, value] of params.entries()) {
        if (key !== 'redirect_uri' && allowedParams.has(key)) {
          target.searchParams.set(key, value);
        }
      }

      if (window.location.hash) {
        target.hash = window.location.hash;
      }

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
