name: Deploy to Firebase Hosting via REST API

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install axios@1.7.9

      - name: Run Deploy Script
        env:
          FIREBASE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_SITE_ID: ${{ vars.FIREBASE_SITE_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_DEPLOY_DIR: ${{ vars.FIREBASE_DEPLOY_DIR }}
        run: node deploy.js
