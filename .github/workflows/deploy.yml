name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell step
        shell: pwsh
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
        run: |
          Write-Host "::add-mask::$($env:GODADDY_API_KEY)"
          Write-Host "::add-mask::$($env:GODADDY_API_SECRET)"
          Write-Host "Starting deploy"
          $authValue = @('sso-key ', $env:GODADDY_API_KEY, ':', $env:GODADDY_API_SECRET) -join ''
          $headers = @{
            Authorization = $authValue
            Accept        = "application/json"
          }
          # Placeholder preflight check until deployment actions are added.
          try {
            $domains = Invoke-RestMethod -Uri "https://api.godaddy.com/v1/domains" -Headers $headers -Method Get
          } catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { $null }
            $details = if ($statusCode) { " (HTTP $statusCode)" } else { "" }
            throw "GoDaddy API request failed$details"
          }
          if ($null -eq $domains) { throw "GoDaddy API returned no data" }
          if (@($domains).Count -eq 0) {
            Write-Host "GoDaddy returned no domains"
          } else {
            Write-Host ("GoDaddy returned {0} domain(s)" -f @($domains).Count)
          }